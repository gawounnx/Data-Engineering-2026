# FinFlow 디자인 토큰 (밝고 정돈된 금융 앱 톤)
# - 배경: 옅은 회색, 콘텐츠: 흰색 카드, 주요 행동: 파란색
# - 색·서체·모서리는 여기서 정하고, styles/main.css는 테마로 표현할 수 없는 규칙만 둔다.

[theme]
base = "light"

primaryColor = "#3182F6"              # 주요 행동(파랑). 흰 글씨 대비 확보
backgroundColor = "#F2F4F6"           # 페이지 배경(옅은 회색)
secondaryBackgroundColor = "#F9FAFB"  # 입력·보조 영역
textColor = "#191F28"                 # 본문
linkColor = "#3182F6"
borderColor = "#E5E8EB"
linkUnderline = false
showWidgetBorder = true
showSidebarBorder = false

blueColor = "#3182F6"
greenColor = "#03B26C"
orangeColor = "#FE9800"
redColor = "#F04452"
grayColor = "#6B7684"

font = "'Pretendard Variable':https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["26px", "20px", "17px", "15px", "14px", "13px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]

baseRadius = "12px"
buttonRadius = "12px"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F4F6"
textColor = "#333D4B"
borderColor = "#E5E8EB"

[client]
toolbarMode = "minimal"   # 개발용 Deploy 버튼 등 숨김
